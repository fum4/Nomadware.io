# Toolchain + operator tasks (devbox docs/dev-contract.md).

[tools]
terraform = "1.16.6"
# pnpm also pinned in package.json `packageManager` (Vercel reads it via Corepack); bump both together.
node = "24.22.1"
pnpm = "12.15.0"
# marketing:preview runs Vercel's own build (`vercel build`, no login: tools/vercel-preview/README.md).
"npm:vercel" = "65.1.0"

[env]
# Linear binding: this repo's backlog, decisions and owner to-dos live in Linear (team NWARE).
LINEAR_TEAM = "NWARE"

[tasks.setup]
description = "Lightweight, secret-free install"
run = "pnpm install --frozen-lockfile"

[tasks.tf]
description = "terraform in infra/terraform with the repo's secrets in memory (mise run tf -- plan)"
run = "repo-secrets exec secrets/terraform.env.age -- env -u AWS_PROFILE -u AWS_DEFAULT_PROFILE -u AWS_SESSION_TOKEN AWS_SHARED_CREDENTIALS_FILE=/dev/null AWS_CONFIG_FILE=/dev/null terraform -chdir=infra/terraform"

[tasks.pre-push]
description = "Static checks: oxfmt + oxlint, workspace typecheck (packages/, tools/), terraform fmt + validate (own data dir: never touches the real backend or state)"
depends = ["setup"]
env = { TF_DATA_DIR = ".terraform-validate" }
run = [
  "pnpm check:format",
  "pnpm check:lint",
  "pnpm check:types",
  "terraform -chdir=infra/terraform fmt -check -recursive",
  "terraform -chdir=infra/terraform init -backend=false -input=false >/dev/null",
  "terraform -chdir=infra/terraform validate",
]

[tasks.pre-merge]
description = "Every workspace package's tests (marketing: vitest; packages/, tools/: node --test), then every app's build: marketing = astro check (types) + astro build"
depends = ["test", "marketing:build"]

[tasks.test]
description = "Unit tests of every workspace package that has them (hermetic)"
depends = ["setup"]
run = "pnpm test"

# wt merge runs this in the main checkout: the stats timer runs from there, so a merged dependency
# change must be installed before its next run.
[tasks.post-merge]
description = "After a merge, in the main checkout: install the workspace"
depends = ["setup"]

# ── apps/marketing (@nomadware/marketing, Astro on Vercel) ────────────────
# Each renders apps/marketing/.env first (dev config; secrets/manifest), which the build needs.
# Astro backgrounds its dev server when it detects an agent; --ignore-lock (package.json) keeps
# it in the foreground so devstack / process-compose own the process.
[tasks."marketing:dev"]
description = "Marketing site dev server (astro dev, :4321)"
depends = ["setup", "secrets:render"]
run = "pnpm --filter @nomadware/marketing dev"

[tasks."marketing:build"]
description = "Marketing site production build: astro check + astro build (what Vercel runs)"
depends = ["setup", "secrets:render"]
run = "pnpm --filter @nomadware/marketing build"

[tasks."marketing:test"]
description = "Marketing site unit tests (vitest, hermetic: no network)"
depends = ["setup"]
run = "pnpm --filter @nomadware/marketing test"

[tasks."marketing:preview"]
description = "Production build as Vercel runs it (vercel build), served locally: pages, /api/*, vercel.json routes (:4321)"
depends = ["setup", "secrets:render"]
run = "pnpm --filter @nomadware/marketing preview"

# ── tools/stats-publisher (@nomadware/stats-publisher, the site's live stats) ──
# Node runs the TypeScript directly; no setup dependency, so the 5-minute timer never installs.
[tasks."stats:compute"]
description = "Update the stats store and print the snapshot JSON, no upload (-- --dry-run: leave the store untouched)"
run = "node tools/stats-publisher/src/main.ts compute"

[tasks."stats:publish"]
description = "Update the stats store and upload the snapshot to R2 (what the devbox timer runs every 5 min)"
run = "repo-secrets exec secrets/site-stats-publisher.env.age -- node tools/stats-publisher/src/main.ts publish"

# ── Secrets (repo-secrets engine; devbox docs/repo-secrets.md) ─────────────
[tasks."secrets:decrypt"]
description = "Materialize file/sshkey secrets, then render the generated env files (with <age>s: only those rows)"
run = "repo-secrets decrypt"

[tasks."secrets:clean"]
description = "Remove materialized plaintext a .age restores (--render: also the generated env files; --all: also ~/.ssh keys)"
run = "repo-secrets clean"

[tasks."secrets:encrypt"]
description = "Re-encrypt file/sshkey secrets from their plaintext (unchanged ones left alone)"
run = "repo-secrets encrypt"

[tasks."secrets:render"]
description = "Regenerate every render-row env file from committed config + secrets"
run = "repo-secrets render"

[tasks."secrets:edit"]
description = "Edit one secret in a tmpfs copy, re-encrypt, re-render (mise run secrets:edit <age>)"
run = "repo-secrets edit"

[tasks."secrets:check"]
description = "Every manifest row has its sources (exit 1 otherwise)"
run = "repo-secrets check"
